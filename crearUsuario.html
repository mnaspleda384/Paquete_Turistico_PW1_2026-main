<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Luma - Crear Usuario</title>
</head>
<body>
        <header>
                <img src="./Imagenes/logo.png" 
                alt="Luma - Viajes que empiezan antes de partir"
                width="350" class="logo">

                <div class="tema">
                        <input type="radio" id="tema-oscuro" name="tema">
                        <label for="tema-oscuro">Tema oscuro</label>
                        <input type="radio" id="tema-claro" name="tema" checked>
                        <label for="tema-claro">Tema claro</label>
                </div>
        </header>
        <main>
                <div class="tarjeta-acceso">
                
                <div class="cabecera-registro">
                <h1>Crear Usuario</h1>
                <p>Completá tus datos para empezar a usar Luma.</p>
                </div>
                
                <form action="inicio.html" method="post"> 
                

                <div class="fila-form">
                        <div class="grupo-form">
                        <label for="nombre">Nombre:</label>
                        <input type="text" id="nombre" name="nombre" required>
                        </div>
                        <div class="grupo-form">
                        <label for="apellido">Apellido:</label>
                        <input type="text" id="apellido" name="apellido" required>
                        </div>
                </div>
                <div class="fila-form">
                <div class="grupo-form">
                        <label for="mail">Email:</label>
                        <input type="email" id="mail" name="mail" required>
                </div>
                
                <div class="grupo-form">
                        <label for="usuario">Usuario:</label>
                        <input type="text" id="usuario" name="usuario" required>
                </div>
                </div>
                
                <div class="fila-form">
                        <div class="grupo-form">
                        <label for="contrasena">Contraseña:</label>
                        <input type="password" id="contrasena" name="contrasena" required>
                        </div>
                        <div class="grupo-form">
                        <label for="contrasena2">Repetir contraseña:</label>
                        <input type="password" id="contrasena2" name="contrasena2" required>
                        </div>
                </div>
                
                <!-- Acciones del formulario -->
                <div class="acciones-registro">
                        <button type="submit" class="boton_principal">Registrarme</button>
                        <a href="inicio.html" class="link-sutil">Volver al inicio</a>
                </div>

        </form>
        </div>
        </main>
        </main>
</body>
</html>
