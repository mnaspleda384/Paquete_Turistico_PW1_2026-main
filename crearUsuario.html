<!DOCTYPE html>
<html lang="en">
<head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="styles.css">
        <title>Luma - Crear Usuario</title>
</head>
<body>
        <header>
                <div class="tema">
                        <input type="radio" id="tema-oscuro" name="tema">
                        <label for="tema-oscuro">Tema oscuro</label>
                        <input type="radio" id="tema-claro" name="tema" checked>
                        <label for="tema-claro">Tema claro</label>
                </div>

                <img src="./Imagenes/logo.png" 
                alt="Luma - Viajes que empiezan antes de partir"
                width="350" class="logo">

        </header>

        <main>
                <h1> Crear Usuario</h1>
                <br>
                <p>Completá tus datos para empezar a usar Luma.</p>
        
                <section class="crear-usuario">
                        <form action="inicio.html" method="post"> 
                                <label for="nombre">Nombre:</label>
                                <input type="text" id="nombre" name="nombre" required>

                                <label for="apellido">Apellido:</label>
                                <input type="text" id="apellido" name="apellido" required>
                
                                <label for="mail">Email:</label>
                                <input type="email" id="mail" name="mail" required >
                
                                <label for="usuario">Usuario:</label>
                                <input type="text" id="usuario" name="usuario" required>
                
                                <label for="contrasena">Contraseña:</label>
                                <input type="password" id="contrasena" name="contrasena" required>
                
                                <label for="contrasena">Repetir contraseña:</label>
                                <input type="password" id="contrasena2" name="contrasena2" required>
                
                                <button type="submit">Enviar</button>
                        </form>
                </section>
        
                <article>
                        <a href="inicio.html">Volver al inicio</a>
                </article>
        </main>
</body>
</html>
