<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Luma - Ingreso</title>
</head>

<body>
    
    <header>
        <img src="./Imagenes/logo.png" 
            alt="Luma - Viajes que empiezan antes de partir"
            width="350" class="logo">

<div class="tema">
            <input type="radio" id="tema-oscuro" name="tema">
            <label for="tema-oscuro">
                <img src="./Imagenes/luna.svg" alt="Tema oscuro" width="24" style="cursor: pointer;">
            </label>
            
            <input type="radio" id="tema-claro" name="tema" checked>
            <label for="tema-claro">
                <img src="./Imagenes/sol.svg" alt="Tema claro" width="24" style="cursor: pointer;">
            </label>
        </div>


    </header>

    <main>
        
<section class="iniciar-sesion">
            <div class="contenedor-h1">
                <h1>Iniciar sesión</h1>
            </div>
            
            <form class="login-container" method="post" action="usuario.html">
                <div>
                    <label class="login-label" for="usuario">Usuario:</label>
                    <input class="login-input" type="text" id="usuario" name="username" placeholder="Ingresa tu usuario" required>
                </div>
            
                <div>
                    <label class="login-label" for="contrasena">Contraseña:</label>
                    <input class="login-input" type="password" id="contrasena" name="password" placeholder="••••••••" required>
                </div>
                
                <button type="submit" class="login-btn">Ingresar</button> 
            </form>
        </section>
        <section class="primera-vez">
            
            <h2 class="titulo-inicio">¿Primera vez en Luma?</h2>
            <p class="parrafo-inicio">Todavía no existe un usuario.Para comenzar, es necesario crear el primer usuario.</p>

            <a href="crearUsuario.html" class="boton_secundario">
                Crear primer usuario</a>
                
        </section>
        
    </main>

    <footer>
<h2>Contacto</h2>
    <ul class="contacto">
        <li>Email: <a href="mailto:contacto@luma.com">contacto@luma.com</a></li>
        <li>WhatsApp: <a href="https://wa.me/541112345678">+54 11 1234-5678</a></li>
        <li>Dirección: Av. Corrientes 1234, CABA</li>
        <li>Horario: Lunes a Viernes de 9 a 18 h</li>
    </ul>
    
    </footer>

</body>
</html>
